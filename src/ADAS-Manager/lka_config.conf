# ── LKA Controller ────────────────────────────────────────────────────────────
# Opção B (17 jul): o PID corre por frame de perceção com dt real (~0.10-0.16s),
# já não a 50 Hz com dados congelados — o termo D deixou de dar picos e voltou
# a ser amortecedor afinável. O deadband passou a rampa suave (sem degrau na
# borda), por isso pode ser mais baixo sem tremer.
kp=4.0
ki=0.0
kd=2.0 #era 1.5
ema_alpha=0.5
deadband=2.0 #era 1.0
snap=1.0
# max_rate é agora por FRAME (~6-10 Hz), não por tick de 50 Hz:
# 40/frame ≈ 250-400 unid/s — rápido p/ curvas, corta coices em reta
max_rate=40

# ── Throttle ──────────────────────────────────────────────────────────────────
# Alinhado com a velocidade real de pista (28-32). NOTA: acima da janela
# adaptativa do OA [20,28] os timings saturam no setpoint hi — recalibrar
# o hi a 30-32 quando o OA for usado a esta velocidade.
throttle=25

# ── State machine ─────────────────────────────────────────────────────────────
degraded_threshold_frames=10
emergency_threshold_ms=1500
recovery_threshold_frames=15
# Force-recover EMERGENCY_STOP → DEGRADED after this long (deadlock breaker
# when STM32 AEB stops car where camera can no longer see lane).
emergency_timeout_ms=10000

# ── Object detection ──────────────────────────────────────────────────────────
obj_conf_thresh=0.60
collision_dist_m=0.30
# SIGN_STOP só trava dentro desta distância do sinal físico (m) — detetado
# longe não deve parar o carro já. TL_RED (semáforo) mantém-se imediato.
stop_sign_dist_m=0.25

# ── Watchdog timeouts (ms) ────────────────────────────────────────────────────
lane_timeout_ms=500
obj_timeout_ms=1000
joy_timeout_ms=200

# ── ACC (Adaptive Cruise Control) ────────────────────────────────────────────
# Set acc_enabled=1 to use ACC mode (STM32 handles speed loop via CTRL_MODE_ACC).
# In LKA mode (acc_enabled=0), throttle= is used instead.
acc_enabled=0
acc_target_kmh=3.5
# acc_headway: 1=close(~0.8s), 2=medium(~1.5s), 3=far(~2.2s)
acc_headway=2

# ── Curve slowdown ────────────────────────────────────────────────────────────
# Reduces speed/throttle when steering is high. Applied in LKA and ACC modes.
# factor = max(curve_min_factor, 1 - curve_gain * |steering|/100) — EMA smoothed
curve_gain=0.9
# 0.7 mantém as curvas a >=21% de throttle (motor só gira fiável acima de ~20%;
# com 0.6 as curvas caíam para 15-18% = zona de empanque)
curve_min_factor=0.9 #estava 0.7
curve_ema_alpha=0.1 #estava 0.2
# single_line_factor: extra reduction when only one lane line visible
single_line_factor=0.9 #estava 0.7

# ── Obstacle Avoidance ────────────────────────────────────────────────────────
# Set oa_enabled=0 to disable OA entirely (LKA-only mode for testing)
oa_enabled=0
# oa_wheelbase_m: measure on physical car (distance between axles)
oa_wheelbase_m=0.18
oa_car_width_m=0.18
oa_margin_m=0.03
oa_critical_dist_m=0.60
oa_servo_max_deg=15.0
oa_throttle_evading=25.0

# Adaptive timing — timings scale with throttle via linear interpolation
# setpoint lo (throttle=20)
oa_throttle_lo=20
oa_evade_ms_lo=1700
oa_straight_ms_lo=700
oa_return_ms_lo=2500

# setpoint hi (throttle=28)
oa_throttle_hi=28
oa_evade_ms_hi=1000
oa_straight_ms_hi=200
oa_return_ms_hi=1800

# Trim de direcao (rodas tortas). + = direita. Carro puxa esquerda -> aumentar.
steering_trim=22

# piso anti-empanque (motor gira fiavel >~20%). Sobe se ainda parar.
curve_throttle_min=21
