# ── LKA Controller ────────────────────────────────────────────────────────────
kp=4.0
ki=0.0
kd=3.0
ema_alpha=0.5
deadband=2.0
snap=2.0
max_rate=20

# ── Throttle ──────────────────────────────────────────────────────────────────
throttle=25

# ── State machine ─────────────────────────────────────────────────────────────
degraded_threshold_frames=10
emergency_threshold_ms=500
recovery_threshold_frames=15

# ── Object detection ──────────────────────────────────────────────────────────
obj_conf_thresh=0.60
collision_dist_m=0.30

# ── Watchdog timeouts (ms) ────────────────────────────────────────────────────
lane_timeout_ms=500
obj_timeout_ms=1000
joy_timeout_ms=200

# ── Obstacle Avoidance ────────────────────────────────────────────────────────
# Set oa_enabled=0 to disable OA entirely (LKA-only mode for testing)
oa_enabled=1
# oa_wheelbase_m: measure on physical car (distance between axles)
oa_wheelbase_m=0.18
oa_car_width_m=0.20
oa_margin_m=0.08
oa_critical_dist_m=0.60
oa_servo_max_deg=15.0
oa_throttle_evading=15.0
# Maneuver durations (ms) — evade and return should be equal for symmetry
oa_evade_ms=600
oa_straight_ms=400
oa_return_ms=600
