name: 'TSF Front-matter validation'

on:
  pull_request:
    branches: [ development, main ]
  push:
    branches: [ development ]

jobs:
  validate-tsf:
    name: Run TSF validators
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run TSF validators
        run: |
          python3 docs/TSF/tsf_implementation/scripts/modules/validate_items_formatation.py

      - name: Guard TruDAG filter safety
        run: |
          set -e
          target="docs/TSF/tsf_implementation/scripts/setup_trudag_clean.sh"
          if grep -nE "grep -v \"shadows an existing Reference\"|grep -v \"\^Reference object\"|grep -v \"\^WARNING.\*Unsupported reference format\"|grep -v \"\^INFO: Executing validator\"|grep -v \"\^INFO: Validator:\"" "$target" | grep -v "|| true"; then
            echo "Found grep filter pipelines without '|| true' guard in $target"
            exit 1
          fi
